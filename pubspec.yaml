name: mochi_site
description: Mochi's Site
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
     sdk: flutter
  jaspr: ^0.22.0
  jaspr_flutter_embed: ^0.4.10
  jaspr_router: ^0.8.1

  universal_web: ^1.1.1+1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.4.6
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.22.0

jaspr:
  mode: static
  port: 8080
  flutter: embedded

flutter:
  uses-material-design: true
