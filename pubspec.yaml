name: mochi_site
description: Mochi's Site
version: 0.0.1

environment:
  sdk: ">=3.10.0"

dependencies:
  flutter:
     sdk: flutter
  jaspr: ^0.22.1
  jaspr_content: ^0.4.5
  jaspr_flutter_embed: ^0.4.10
  jaspr_router: ^0.8.1
  file: ^7.0.1

  universal_web: ^1.1.1+1
  intl: ^0.20.2
  uuid: ^4.5.2

  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.10.4
  build_web_compilers: ^4.4.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.22.1

  json_serializable: ^6.11.3

jaspr:
  mode: static
  port: 8080
  flutter: embedded

flutter:
  uses-material-design: true
